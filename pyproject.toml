[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-ltv-engine"
version = "0.1.0"
description = "Production-oriented Customer Churn Prediction and Customer Lifetime Value Analytics Engine"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["churn-prediction", "customer-lifetime-value", "fastapi", "shap", "postgresql", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    { name = "Varsha Pandey", email = "varshapandey8757@gmail.com" },
    { name = "Abhishek Tiwari", email = "at4713@dseu.ac.in" },
    { name = "Sairaj Gupta", email = "sairajgupta123@gmail.com" },
    { name = "Harshitha", email = "harshithad492@gmail.com" },
    { name = "Ravi", email = "rptiwari.ravi@gmail.com" },
    { name = "Darshan Patil" }
]
dependencies = [
    "pandas>=3.0.5",
    "numpy>=2.5.3",
    # Models in models/ were pickled with these exact versions
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "joblib>=1.6.0",
    "shap>=0.52.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "pydantic>=2.13.5",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "python-dotenv>=1.2.3",
    "SQLAlchemy>=2.0.52",
    "psycopg2-binary>=2.9.13"
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.40.0"
]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1"
]

[project.urls]
Repository = "https://github.com/Varshapandey-8757/customer-churn-ltv-engine"
Issues = "https://github.com/Varshapandey-8757/customer-churn-ltv-engine/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "src*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py312', 'py313']
