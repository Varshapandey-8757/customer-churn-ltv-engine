[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-ltv-engine"
version = "0.1.0"
description = "Production-oriented Customer Churn Prediction and Customer Lifetime Value Analytics Engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Varsha Pandey", email = "varsha@example.com" },
    { name = "Abhishek Tiwari", email = "at4713@dseu.ac.in" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "joblib>=1.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']
